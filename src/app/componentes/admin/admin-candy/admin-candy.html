<div class="admin-container">
    <h2>Administrador de Candy Bar</h2>

    <!-- Mensajes de Error y Éxito -->
    <div *ngIf="mensajeError" class="alert alert-danger full-width">
        {{ mensajeError }}
    </div>

    <div *ngIf="mensajeExito" class="alert alert-success full-width">
        {{ mensajeExito }}
    </div>

    <!-- Formulario -->
    <form (ngSubmit)="guardarProducto()" class="grid-form" novalidate>
        <div class="form-group">
        <label>Nombre del Producto *</label>
        <input type="text" [(ngModel)]="productoForm.nombre" name="nombre" placeholder="Ej: Pochoclos Medianos">
        </div>

        <div class="form-group">
        <label>Categoría *</label>
        <select [(ngModel)]="productoForm.categoria" name="categoria">
            <option *ngFor="let cat of categorias" [value]="cat">{{ cat }}</option>
        </select>
        </div>

        <div class="form-group">
        <label>Precio ($) *</label>
        <input 
            type="number" 
            [(ngModel)]="productoForm.precio" 
            (ngModelChange)="onPrecioChange()" 
            name="precio" 
            placeholder="0">
        </div>

        <div class="form-group">
        <label>Puntos de Canje (10% Automático)</label>
        <input 
            type="number" 
            [(ngModel)]="productoForm.puntos_canje" 
            name="puntos_canje" 
            readonly 
            style="background-color: #e9ecef; cursor: not-allowed;">
        </div>

        <div class="form-group full-width">
        <label>Descripción</label>
        <textarea [(ngModel)]="productoForm.descripcion" name="descripcion" rows="2"></textarea>
        </div>

        <div class="form-group full-width">
        <label>URL Imagen</label>
        <input type="text" [(ngModel)]="productoForm.imagen_url" name="imagen_url">
        </div>

        <div class="form-group">
        <label>Descuento Semanal</label>
        <input type="text" [(ngModel)]="productoForm.descuento_semanal" name="descuento_semanal" placeholder="ej: 20% desc.">
        </div>

        <div class="form-group checkbox-group">
        <input type="checkbox" id="combo" [(ngModel)]="productoForm.combo_especial" name="combo_especial">
        <label for="combo">Es Combo Especial</label>
        </div>



        <div class="form-actions full-width">
        <button type="submit" class="btn-primary">
            {{ modoEdicion ? 'Actualizar Producto' : 'Guardar Producto' }}
        </button>
        
        <!-- Botón Cancelar/Limpiar visible siempre o en edición -->
        <button type="button" class="btn-warning" (click)="limpiarFormulario()">
            {{ modoEdicion ? 'Cancelar Edición' : 'Limpiar Campos' }}
        </button>
        </div>
    </form>

    <!-- Tabla de Datos -->
    <table class="data-table" *ngIf="!cargando && productos.length > 0">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Precio</th>
            <th>Puntos</th>
            <th>Combo</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let p of productos">
            <td>{{ p.id }}</td>
            <td>{{ p.nombre }}</td>
            <td><span class="badge-categoria">{{ p.categoria }}</span></td>
            <td>${{ p.precio }}</td>
            <td>{{ p.puntos_canje }} pts</td>
            <td>
            <span *ngIf="p.combo_especial" class="badge-combo">Combo</span>
            <span *ngIf="!p.combo_especial">-</span>
            </td>
            <td>
            <button class="btn-warning" (click)="editarProducto(p)">Editar</button>
            <button class="btn-danger" (click)="eliminarProducto(p.id)">Eliminar</button>
            </td>
        </tr>
        </tbody>
    </table>
    </div>
