<div class="admin-container">
    <aside class="admin-sidebar">
        <h2>Panel Admin</h2>
        <nav>
        <button (click)="cambiarSeccion('funciones')" [class.active]="seccionActual === 'funciones'">
            Funciones y Películas
        </button>
        <button (click)="cambiarSeccion('candy')" [class.active]="seccionActual === 'candy'">
            Candy Bar y Combos
        </button>
        <button (click)="cambiarSeccion('descuentos')" [class.active]="seccionActual === 'descuentos'">
            Descuentos y Puntos
        </button>
        </nav>
    </aside>

    <main class="admin-content">
        @switch (seccionActual) {
        @case ('funciones') { <app-admin-funciones /> }
        @case ('candy') { <app-admin-candy /> }
        @case ('descuentos') { <app-admin-descuentos /> }
        }
    </main>
</div>
